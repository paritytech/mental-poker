[workspace.package]
authors = ["Jeffrey Burdges <jeff@web3.foundation>", "Geometry Research (https://geometryresearch.xyz)"]
version = "0.1.0"
edition = "2024"
homepage = "https://github.com/w3f/mental-poker"
repository = "https://github.com/w3f/mental-poker.git"
# readme = "README.md"

[workspace]
resolver = "2"

members = [
    "proofs",
    "protocol",
    "deck",
    "deck-secp256k1",
    "ez", 
    "play",
]

[workspace.dependencies]

cards-proofs = { path = "proofs", default-features = false }
cards-deck = { path = "deck", default-features = false }
cards-protocol = { path = "protocol", default-features = false }
deck-secp256k1 = { path = "deck-secp256k1", default-features = false }
ez-serialize = { path = "ez" }
cards-play = { path = "play" }

ark-ec = { version = "0.5.0", default-features = false }
ark-ff = { version = "0.5.0", default-features = false }
ark-serialize = { version = "0.5.0", default-features = false }
ark-std = { version = "0.5.0", default-features = false }

ark-secp256k1 = { version = "0.5.0", default-features = false }
ark-bls12-377 = { version = "0.5.0" }
ark-bls12-381 = { version = "0.5.0" }

ark-transcript = { version = "0.0.5", default-features = false }

# arrayvec = { version = "0.7.6", default-features = false }

# TODO: Figure out the feature passing here
rand = { version = "0.8.5" } #  default-features = false }
getrandom_or_panic = { version = "0.0.3", default-features = false }

thiserror = { version = "2", default-features = false }


